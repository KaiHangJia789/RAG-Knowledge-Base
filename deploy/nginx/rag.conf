# 线上反向代理配置（复制到服务器 /etc/nginx/conf.d/rag.conf）
# 只代理 web（3000）；web 内部通过 rewrite 把 /api/v1/* 转发给 backend，
# 所以 backend 的 8000 端口和 /docs 不对公网开放。
# 证书由 acme.sh（DNS-01，阿里云 DNS）签发并安装到 /etc/nginx/ssl/，续期后自动 reload nginx。

server {
    listen 80;
    server_name suming.work;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name suming.work;

    ssl_certificate     /etc/nginx/ssl/suming.work/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/suming.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 文档上传的大小上限，与后端 MAX_UPLOAD_SIZE_MB 保持一致
    client_max_body_size 50m;

    location / {
        # 临时访问控制（basic auth）：站点暂无登录功能，删除文档等接口对公网开放。
        # 密码文件用 htpasswd 生成到 /etc/nginx/.htpasswd，待登录功能上线后移除。

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 生成答案可能较慢，超时放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
